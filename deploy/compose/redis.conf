bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data
aclfile /etc/redis/users.acl
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
