global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 3hk-new
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8888"]
    # Inject x-metrics-secret from file via scrape config headers (Prometheus >= 2.26)
    # Value is loaded by compose from secrets; file content is the raw secret.
