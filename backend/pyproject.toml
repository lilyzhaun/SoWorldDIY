[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/request_overrides_local.py",
  "app/request_overrides_local.example.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
fail_under = 84
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

