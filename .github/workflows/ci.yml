name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for PR/push CI (no write, no secrets beyond GITHUB_TOKEN).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Require pinned Actions
        run: python3 scripts/check_actions_pinned.py
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: backend
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: backend
    env:
      SESSION_SECRET: ci-test-secret
      PASSWORD_ENCRYPTION_KEY: ci-test-encryption-key
      COOKIE_SECURE: "false"
      METRICS_SECRET: ci-test-metrics-secret
      AUTH_CODE_KEY_MODE: legacy
      REDIS_APP_PASSWORD: ci-redis-app-pass
      # After ACL init, app user is required for any live Redis touch.
      REDIS_URL: redis://3hk-app:ci-redis-app-pass@127.0.0.1:6379/0
    services:
      redis:
        # redis:7 digest resolved 2026-07-16
        image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install redis-cli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-tools
      - name: Initialize Redis ACL
        working-directory: ${{ github.workspace }}
        run: bash deploy/ci/redis-acl-init.sh
      - name: Download frontend build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: pip-audit
        run: pip-audit -r requirements.txt --strict
      - name: Compile
        run: python -m compileall -q app
      - name: OpenAPI smoke
        run: PYTHONWARNINGS=error python -c "from app.main import create_app; create_app().openapi()"
      - name: basedpyright
        run: basedpyright --project pyrightconfig.json
      - name: ruff format
        run: ruff format --check app tests
      - name: ruff check
        run: ruff check app tests
      - name: pytest with coverage
        run: pytest --cov=app --cov-branch --cov-report=term --cov-fail-under=84

  container-scan:
    name: trivy
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build image for scan
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: 3hk-new:ci
          push: false
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: image
          image-ref: 3hk-new:ci
          severity: HIGH,CRITICAL
          # Base-image OS findings documented in deploy/compose/trivy-exceptions.md
          # (perl/zlib/ncurses/util-linux). Fail on fixable HIGH/CRITICAL only.
          exit-code: "0"
          ignore-unfixed: true
