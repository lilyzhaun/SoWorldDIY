name: Release

# Tag-driven publish only. Manual dispatch is dry-run (no GHCR/Release publish).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

# Default least privilege; publish job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-test-secret
      PASSWORD_ENCRYPTION_KEY: ci-test-encryption-key
      COOKIE_SECURE: "false"
      METRICS_SECRET: ci-test-metrics-secret
      AUTH_CODE_KEY_MODE: legacy
      REDIS_APP_PASSWORD: ci-redis-app-pass
      REDIS_URL: redis://3hk-app:ci-redis-app-pass@127.0.0.1:6379/0
    services:
      redis:
        image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require pinned Actions
        run: python3 scripts/check_actions_pinned.py
      - name: Release deploy policy
        run: python3 scripts/check_release_policy.py
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color
      - name: Extract notes from CHANGELOG
        id: notes
        run: python3 scripts/release_notes.py CHANGELOG.md "$GITHUB_REF" /tmp/release-notes.md
      - name: Setup Node (frontend gate)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
      - name: Setup Python 3.11 (backend gate)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install Redis tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server redis-tools
      - name: Initialize Redis ACL
        run: bash deploy/ci/redis-acl-init.sh
      - name: Backend checks on Python 3.11
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -r requirements-dev.txt
          pip-audit -r requirements.txt --strict
          basedpyright --project pyrightconfig.json
          ruff format --check app tests
          ruff check app tests
          python -m pytest -q
      - name: Setup Python 3.12 (coverage gate)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Backend coverage on Python 3.12
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest --cov=app --cov-branch --cov-fail-under=84 -q
      - name: Upload release notes artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: /tmp/release-notes.md
          retention-days: 7

  build:
    name: build-image
    runs-on: ubuntu-latest
    needs: [validate]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      dry_run: ${{ steps.flags.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide dry-run
        id: flags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build image (no push on dry-run)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: 3hk-new:release-local
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 3hk-new:release-local
          severity: HIGH,CRITICAL
          # Base-image OS findings documented in deploy/compose/trivy-exceptions.md
          exit-code: "0"
          ignore-unfixed: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: ${{ needs.build.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: /tmp/release-notes
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Attest
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: /tmp/release-notes/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
