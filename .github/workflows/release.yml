name: Release

# Tag-driven publish only. Manual dispatch is dry-run (no GHCR/Release publish).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

# Default least privilege; publish job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Require pinned Actions
        run: python3 scripts/check_actions_pinned.py
      - name: Release deploy policy
        run: python3 scripts/check_release_policy.py
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color
      - name: Extract notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Prefer Unreleased section for dry-run; for tags, prefer matching version if present.
          m = re.search(r"## \[Unreleased\]\n(.*?)(?=\n## |\Z)", text, re.S)
          body = (m.group(1).strip() if m else "See CHANGELOG.md")
          Path("/tmp/release-notes.md").write_text(body + "\n", encoding="utf-8")
          print("notes_bytes", len(body))
          PY
      - name: Setup Node (frontend gate)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
      - name: Setup Python (backend gate)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Backend checks
        working-directory: backend
        env:
          SESSION_SECRET: ci-test-secret
          PASSWORD_ENCRYPTION_KEY: ci-test-encryption-key
          COOKIE_SECURE: "false"
          METRICS_SECRET: ci-test-metrics-secret
          AUTH_CODE_KEY_MODE: legacy
        run: |
          set -euo pipefail
          pip install -r requirements.txt -r requirements-dev.txt
          pip-audit -r requirements.txt --strict
          basedpyright --project pyrightconfig.json
          ruff format --check app tests
          ruff check app tests
          pytest --cov=app --cov-branch --cov-fail-under=84 -q
      - name: Upload release notes artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: /tmp/release-notes.md
          retention-days: 7

  build:
    name: build-image
    runs-on: ubuntu-latest
    needs: [validate]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      dry_run: ${{ steps.flags.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Decide dry-run
        id: flags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build image (no push on dry-run)
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: 3hk-new:release-local
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          scan-type: image
          image-ref: 3hk-new:release-local
          severity: HIGH,CRITICAL
          # Base-image OS findings documented in deploy/compose/trivy-exceptions.md
          exit-code: "0"
          ignore-unfixed: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: ${{ needs.build.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: /tmp/release-notes
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Attest
        uses: actions/attest-build-provenance@db473fddc028af60658334401dc6fa3ffd8669fd # v2.3.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: /tmp/release-notes/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
