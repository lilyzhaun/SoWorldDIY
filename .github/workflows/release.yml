name: Release

# Tag-driven publish only. Manual dispatch is dry-run (no GHCR/Release publish).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without publishing"
        type: boolean
        default: true

# Default least privilege; publish job elevates only what it needs.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      scan_container: false

  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require pinned Actions
        run: python3 scripts/check_actions_pinned.py
      - name: Release deploy policy
        run: python3 scripts/check_release_policy.py
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.12
          curl --fail --max-time 60 -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xz -C /tmp -f /tmp/actionlint.tar.gz actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color
      - name: Extract notes from CHANGELOG
        id: notes
        run: python3 scripts/release_notes.py CHANGELOG.md "$GITHUB_REF" /tmp/release-notes.md
      - name: Upload release notes artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: /tmp/release-notes.md
          retention-days: 7

  build:
    name: build-image
    runs-on: ubuntu-latest
    needs: [validate, checks]
    timeout-minutes: 20
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      dry_run: ${{ steps.flags.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide dry-run
        id: flags
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Build image (no push on dry-run)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: 3hk-new:release-local
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 3hk-new:release-local
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Save scanned image
        run: docker save -o /tmp/release-image.tar 3hk-new:release-local
      - name: Generate scanned image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: 3hk-new:release-local
          format: cyclonedx
          output: /tmp/release-sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-sbom
          path: /tmp/release-sbom.json
          retention-days: 7
      - name: Upload scanned image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanned-release-image
          path: /tmp/release-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, build]
    if: ${{ needs.build.outputs.dry_run != 'true' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: /tmp/release-notes
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-sbom
          path: /tmp/release-sbom
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scanned-release-image
          path: /tmp/scanned-image
      - name: Publish the scanned image without rebuilding
        id: push
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          docker load -i /tmp/scanned-image/release-image.tar
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag 3hk-new:release-local "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
          ref=$(docker image inspect 3hk-new:release-local --format '{{index .RepoDigests 0}}')
          echo "digest=${ref##*@}" >> "$GITHUB_OUTPUT"
      - name: Attest
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: /tmp/release-notes/release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: /tmp/release-sbom/release-sbom.json
