name: Shared checks

on:
  workflow_call:
    inputs:
      scan_container:
        type: boolean
        default: true

# Least privilege for PR/push CI (no write, no secrets beyond GITHUB_TOKEN).
permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require pinned Actions
        run: python3 scripts/check_actions_pinned.py
      - name: Repository security policy
        run: python3 scripts/check_security_policy.py
      - name: Release policy
        run: python3 scripts/check_release_policy.py
      - name: Runtime lock consistency
        run: python3 scripts/check_python_lock.py
      - name: Install actionlint
        run: |
          set -euo pipefail
          VERSION=1.7.12
          curl --fail --max-time 60 -sSL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xz -C /tmp -f /tmp/actionlint.tar.gz actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version
      - name: actionlint
        run: actionlint -color

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        node: ["20.19.0", "24", "26"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=moderate
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage -- --maxWorkers=1 --no-file-parallelism
      - name: Chromium tests
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Build
        run: npm run build
      - name: Upload frontend dist
        if: matrix.node == '20.19.0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    needs: [frontend]
    defaults:
      run:
        working-directory: backend
    env:
      SESSION_SECRET: ci-test-secret
      PASSWORD_ENCRYPTION_KEY: ci-test-encryption-key
      COOKIE_SECURE: "false"
      METRICS_SECRET: ci-test-metrics-secret
      AUTH_CODE_KEY_MODE: legacy
      REDIS_APP_PASSWORD: ci-redis-app-pass
      # After ACL init, app user is required for any live Redis touch.
      REDIS_URL: redis://3hk-app:ci-redis-app-pass@127.0.0.1:6379/0
    services:
      redis:
        # redis:7 digest resolved 2026-07-16
        image: redis:7@sha256:a8f08480e1f88f2647fed492d1178c06abb0d0c1fbf02c682a61e2f483fb3954
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Redis tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server redis-tools
      - name: Initialize Redis ACL
        working-directory: ${{ github.workspace }}
        run: bash deploy/ci/redis-acl-init.sh
      - name: Download frontend build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -r requirements-dev.txt
      - name: pip-audit
        run: pip-audit -r requirements.lock --strict
      - name: Compile
        run: python -m compileall -q app
      - name: OpenAPI smoke
        run: PYTHONWARNINGS=error python -c "from app.main import create_app; create_app().openapi()"
      - name: basedpyright
        run: basedpyright --project pyrightconfig.json
      - name: ruff format
        run: ruff format --check app tests
      - name: ruff check
        run: ruff check app tests
      - name: Tests with coverage
        run: |
          python --version
          if [ "${{ matrix.python }}" = "3.12" ]; then
            python -m pytest --cov=app --cov-branch --cov-report=term --cov-fail-under=84
          else
            python -m pytest
          fi
      - name: Docs consistency
        working-directory: ${{ github.workspace }}
        run: python scripts/check_docs_consistency.py
      - name: Deployment regressions
        working-directory: ${{ github.workspace }}
        run: python scripts/check_deployment.py

  compose-scan:
    name: compose-${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      matrix:
        service: [redis, prometheus]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup monitoring image builder
        if: matrix.service == 'prometheus'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build monitoring security image
        if: matrix.service == 'prometheus'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/monitoring/Dockerfile
          load: true
          tags: soworld-prometheus:local
          cache-from: type=gha,scope=soworld-monitoring
          cache-to: type=gha,scope=soworld-monitoring,mode=max
      - name: Resolve shipped Compose image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          image=$(docker compose --env-file deploy/compose/env.example --profile monitoring config --format json | jq -r --arg service "$SERVICE" '.services[$service].image')
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Scan Compose image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  container-scan:
    if: inputs.scan_container
    name: trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: 3hk-new:ci
          push: false
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: 3hk-new:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
